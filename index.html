» Sarkadi Dániel gyermekem ügyében az alábbi nyilatkozatot teszem.

Fiamnak évek óta beilleszkedési, tanulási, magatartási nehézségei vannak az iskolában. Jelentősen alulteljesít a képességeihez mérten, 
ezért a pedagógiai szakszolgálat további vizsgálatát kezdeményeztem.
Társainak megalázó, fenyegető megjegyzéseit nehezen kezeli, ebben nem akar részt venni, elutasítja és nem akar ilyen közösségbe megjelenni, 
ez okozhatja folyamatos egészségügyi problémáit is. A hiányzásai miatt és rossz hangulata miatt kudarcok érik.

Gyermeknek is joga van ahhoz, hogy segítséget kapjon, személyiségének kibontakoztatásához, a fejlődését veszélyeztető helyzet elhárításához, 
a számára megfelelő társadalomba való beilleszkedéséhez, valamint önálló életvitelének megteremtéséhez, ezért egyéni tanrendben történő tanulását 

kéri. Ennek érdekében indítottam vizsgálatot a szakszolgálatnál.

Ezek alapján személyiségfejlődése nehezített vagy sajátos tendenciákat mutat.

Az én gyermeknek is joga van emberi méltósága tiszteletben tartásához, a bántalmazással, ártalommal szembeni védelemhez, ami nem csak a családban történhet.

Erre az időszakra kérem a gyámügyi törvény gyermekemre vonatkozó részének figyelembevételét, a gyermekre vonatkozó negatív beavatkozás kizárását, a gyámügyi eljárás alkalmazásának felfüggesztését a 
párhuzamosan történő vizsgálatok gyermekre történő pozitív és megnyugtató döntésig és a probléma megszüntetéséig.

Az én célom is az, hogy a gyermekem tanulmánya a -probléma keletkezésének előtti teljesítménye szerint- legalább jó eredményű legyen.
Végzéstechnikus szeretne lenni jelenleg.
Kérem, hogy ne vegyenek továbbra is azonos eljárás alá a gondatlan magatartásból adódó ügyekkel.

function drawMenu() {
    ctx.fillStyle = "#1a0022"; ctx.fillRect(0,0,900,500);
    ctx.fillStyle = "#ff0"; ctx.font = "bold 55px Arial";
    ctx.fillText("FEKÉLY RAJT!", 235, 190);
    ctx.font = "26px Arial"; ctx.fillStyle = "#0f0";
    ctx.fillText("Made by Bubesz & Kanapé", 290, 270);
}

function showInfo() {
    document.getElementById("infoScreen").style.display = "block";
    document.getElementById("doxContent").textContent = doxText;
}

function hideInfo() {
    document.getElementById("infoScreen").style.display = "none";
}

function drawGame() {
    ctx.fillStyle = "#1a0022"; ctx.fillRect(0,0,900,500);
    ctx.fillStyle = "#220033"; ctx.fillRect(0,300,900,200);
    
    ctx.fillStyle = "#ffcc99"; ctx.fillRect(105, playerY+25, 68, 68);
    ctx.fillStyle = "#ffaa77"; ctx.beginPath(); ctx.arc(138, playerY+22, 26, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ff0"; ctx.font = "bold 42px Arial"; ctx.fillText("✡️", 122, playerY+52);
    
    ctx.font = "58px Arial"; ctx.fillStyle = "#00ccff";
    obstacles.forEach(o => ctx.fillText("🍼", o.x, o.y+48));
    
    ctx.fillStyle = "#0f0"; ctx.font = "26px Arial";
    ctx.fillText("Pont: " + Math.floor(score), 30, 50);
}

function update() {
    if (gameState !== "playing") return;
    velocity += 0.92; playerY += velocity;
    if (playerY >= 255) { playerY = 255; velocity = 0; }
    score += 0.28; frame++;
    
    if (frame % 88 === 0 && Math.random() < 0.6) obstacles.push({x: 920, y: 245});
    
    for (let i = obstacles.length-1; i >= 0; i--) {
        obstacles[i].x -= speed;
        if (obstacles[i].x < 160 && obstacles[i].x + 50 > 115 && playerY > 190) {
            gameOver = true; gameState = "gameover";
        }
        if (obstacles[i].x < -70) obstacles.splice(i,1);
    }
    if (score >= 1000) { won = true; gameState = "won"; }
}

function loop() {
    if (gameState === "playing") update();
    if (gameState === "menu") drawMenu();
    else drawGame();
    requestAnimationFrame(loop);
}

// Gombok
const startBtn = document.createElement("button");
startBtn.textContent = "FEKÉLY RAJT!";
startBtn.onclick = () => { gameState = "playing"; hideInfo(); resetGame(); };
document.body.appendChild(startBtn);

const infoBtn = document.createElement("button");
infoBtn.textContent = "INFO";
infoBtn.onclick = () => {
    if (gameState === "info") { hideInfo(); gameState = "menu"; }
    else { gameState = "info"; showInfo(); }
};
document.body.appendChild(infoBtn);

function resetGame() {
    playerY = 255; velocity = 0; obstacles = []; score = 0; speed = 6.8; gameOver = false; won = false; frame = 0;
}

document.addEventListener("keydown", e => {
    if (e.key === " " && gameState === "playing" && playerY >= 255) velocity = -21;
    if ((gameOver || won) && e.key === " ") gameState = "menu";
});

canvas.addEventListener("click", () => {
    if (gameState === "playing" && playerY >= 255) velocity = -21;
});

loop();
</script>
